name: userland

on:
  push:
    branches: ["**"]
    paths:
      - "userland/**"
      - "cmd/ohbutton/**"
      - ".github/workflows/userland.yml"
  workflow_dispatch:
  workflow_call:

env:
  BUILDROOT_VERSION: "2026.02.3"

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc cpio rsync unzip file wget

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('userland/configs/*') }}
          restore-keys: br-dl-${{ env.BUILDROOT_VERSION }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go helpers
        run: |
          mkdir -p hostbin
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o hostbin/ohbutton ./cmd/ohbutton

      - name: Fetch Buildroot
        run: git clone --depth 1 --branch "$BUILDROOT_VERSION" https://gitlab.com/buildroot.org/buildroot.git buildroot

      - name: Build root filesystem
        env:
          OPENHUB2_VERSION: ${{ github.sha }}
          OPENHUB2_BIN_DIR: ${{ github.workspace }}/hostbin
        run: |
          chmod +x userland/board/openhub2/post-build.sh
          make -C buildroot BR2_EXTERNAL="$PWD/userland" O="$PWD/out" openhub2_defconfig
          make -C out -j"$(nproc)"

      - name: Check size (rootfs slot is 16 MiB)
        run: |
          size=$(stat -c %s out/images/rootfs.squashfs)
          echo "rootfs.squashfs: $size bytes"
          test "$size" -le 16777216
          sha256sum out/images/rootfs.squashfs > out/images/rootfs.squashfs.sha256

      - name: Collect licenses and sources (legal-info)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make -C out legal-info
          tar -C out -czf out/images/openhub2-userland-legal-info.tar.gz legal-info

      - uses: actions/upload-artifact@v4
        with:
          name: openhub2-rootfs
          path: |
            out/images/rootfs.squashfs
            out/images/rootfs.squashfs.sha256
            out/images/openhub2-userland-legal-info.tar.gz
          if-no-files-found: ignore
